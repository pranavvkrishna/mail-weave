<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mail Weave</title>
    <style>
        body {
            width: 340px;
            padding: 16px;
            font-family: Georgia, 'Times New Roman', Times, serif;
            background-color: cornflowerblue;
            box-sizing: border-box;
        }
        h1 {
            font-size: 16px;
            font-weight: 600;
            margin: 0 0 12px 0;
            color: #202124;
            text-align: center;
        }
        #checklist-container {
            background: #fff;
            padding: 10px;
            border-radius: 5px;
            max-height: 350px;
            overflow-y: auto;
        }
        .task-item {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 8px 4px;
            border-bottom: 1px solid #eee;
        }
        .task-item:last-child {
            border-bottom: none;
        }
        .task-checkbox {
            margin-top: 3px;
            cursor: pointer;
        }
        .task-content {
            flex: 1;
        }
        .task-text {
            font-size: 13px;
            color: #202124;
        }
        .task-deadline {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
        }
        .task-category {
            display: inline-block;
            font-size: 10px;
            color: #fff;
            background: #4285f4;
            padding: 1px 6px;
            border-radius: 8px;
            margin-top: 4px;
        }
        .task-done .task-text {
            text-decoration: line-through;
            color: #999;
        }
        .task-done .task-deadline {
            color: #bbb;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 14px;
            padding: 0 4px;
        }
        .delete-btn:hover {
            color: #ea4335;
        }
        .empty-state {
            color: #999;
            text-align: center;
            padding: 16px;
            font-size: 13px;
        }
        #add-task-form {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        #new-task-input, #new-deadline-input {
            padding: 6px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 12px;
            font-family: inherit;
        }
        #add-task-btn {
            padding: 6px 10px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        #add-task-btn:hover {
            background: #3367d6;
        }
    </style>
</head>
<body>
    <h1>MailWeave Checklist</h1>

    <div id="checklist-container">
        <div class="empty-state">Loading...</div>
    </div>

    <form id="add-task-form">
        <input type="text" id="new-task-input" placeholder="Task name..." required>
        <input type="text" id="new-deadline-input" placeholder="Deadline (optional)">
        <button type="submit" id="add-task-btn">Add</button>
    </form>

    <script src="popup.js"></script>
</body>
</html>
